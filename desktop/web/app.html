<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BrowseTerm</title>
    <link rel="stylesheet" href="static/css/app.css">
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <span class="logo-text">BrowseTerm</span>
        </div>

        <div class="sidebar-menu">
            <ul class="menu-items">
                <li class="menu-item">
                    <a href="#" class="menu-link active">
                        <span class="menu-icon">🖥️</span>
                        <span class="menu-text">Device</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="sidebar-footer">
            <button class="logout-btn" id="logoutBtn">
                <span class="logout-icon">⏻</span>
                <span class="logout-text">Logout</span>
            </button>
        </div>
    </nav>

    <main class="main-content">
        <div class="content-container">
            <h1>Device</h1>

            <div class="status-row">
                <span id="statusBadge" class="status-badge not_registered">-</span>
            </div>

            <div class="device-card">
                <div class="device-field">
                    <span class="device-field-label">Device Name</span>
                    <span class="device-field-value" id="deviceName">-</span>
                </div>
                <div class="device-field">
                    <span class="device-field-label">Operating System</span>
                    <span class="device-field-value" id="deviceOs">-</span>
                </div>
                <div class="device-field">
                    <span class="device-field-label">Architecture</span>
                    <span class="device-field-value" id="deviceArch">-</span>
                </div>
                <div class="device-field">
                    <span class="device-field-label">CPU</span>
                    <span class="device-field-value" id="deviceCpu">-</span>
                </div>
                <div class="device-field">
                    <span class="device-field-label">Memory</span>
                    <span class="device-field-value" id="deviceMemory">-</span>
                </div>
                <div class="device-field">
                    <span class="device-field-label">Storage</span>
                    <span class="device-field-value" id="deviceStorage">-</span>
                </div>
            </div>

            <button class="activate-btn" id="activateBtn">Activate</button>
            <div class="error-message" id="errorMessage"></div>

            <h1 class="section-title">Cluster</h1>

            <div class="cluster-card">
                <div class="slider-row">
                    <div class="slider-label">
                        <span>CPU</span>
                        <span class="slider-value" id="cpuValue">-</span>
                    </div>
                    <input type="range" class="slider" id="cpuSlider" min="1" max="1" step="1">
                </div>
                <div class="slider-row">
                    <div class="slider-label">
                        <span>Memory</span>
                        <span class="slider-value" id="memoryValue">-</span>
                    </div>
                    <input type="range" class="slider" id="memorySlider" min="1" max="1" step="1">
                </div>
                <div class="slider-row">
                    <div class="slider-label">
                        <span>Storage</span>
                        <span class="slider-value" id="storageValue">-</span>
                    </div>
                    <input type="range" class="slider" id="storageSlider" min="5" max="5" step="5">
                </div>
            </div>

            <div class="status-row">
                <span id="clusterStatusBadge" class="status-badge not_registered">-</span>
            </div>

            <div class="cluster-buttons">
                <button class="activate-btn" id="clusterBtn">Setup</button>
                <button class="activate-btn secondary-btn" id="openBrowserBtn" hidden>Open in Browser</button>
            </div>
            <div class="error-message" id="clusterError"></div>

            <ul class="setup-steps" id="setupSteps" hidden></ul>

            <div class="pod-table-wrap" id="podTableWrap" hidden>
                <table class="pod-table">
                    <thead>
                        <tr>
                            <th>Namespace</th>
                            <th>Pod</th>
                            <th>Ready</th>
                            <th>Status</th>
                            <th>Restarts</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="podTableBody"></tbody>
                </table>
                <p class="pod-table-empty" id="podTableEmpty" hidden>No pods yet.</p>
            </div>
        </div>
    </main>

    <script src="static/js/app.js"></script>
</body>
</html>
