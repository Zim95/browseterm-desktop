[tool.poetry]
name = "browseterm-desktop"
version = "0.1.0"
description = "Browseterm Desktop app - shared Local login flow, device bootstrap/activation, Keychain-backed device credential."
authors = ["Zim95 <shresthanamah@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
pywebview = [
    {version = "^5.0", markers = "sys_platform == 'darwin'", extras = ["cocoa"]},
    # Windows needs no extra: pywebview's own base install already pulls in `pythonnet` for
    # sys_platform == 'win32' (confirmed via its own package metadata), which gives it the native
    # WebView2/MSHTML-backed renderer - `cefpython3` (the "cef" extra) is only an optional fallback,
    # not required for standard Windows support. README's own "macOS/Windows only" GUI claim had
    # never actually been backed by an installable dependency on win32 until now.
    {version = "^5.0", markers = "sys_platform == 'win32'"},
]
httpx = "^0.27.0"
keyring = "^25.0"
ipython = "8.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pillow = "^12.3.0"
pyinstaller = "^6.22.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
